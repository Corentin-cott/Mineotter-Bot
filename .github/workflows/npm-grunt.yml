name: NodeJS with Grunt

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Checkout Otterbots framework
      uses: actions/checkout@v4
      with:
        repository: L-Antre-des-Loutres/Otterbots
        ref: develop
        path: .otterbots-tmp

    - name: Vendor Otterbots into src/otterbots
      run: |
        mkdir -p src/otterbots
        cp -R .otterbots-tmp/src/otterbots/. src/otterbots/
        rm -rf .otterbots-tmp

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npm run lint
        npm run build
