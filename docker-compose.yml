services:
  mineotter:
    image: mineotter:latest
    container_name: bot_discord-mineotter
    restart: unless-stopped
    ports:
      - "9503:3000"
    env_file:
      - .env
    environment:
      DOCKER_HOST: tcp://docker_proxy-discord_bots:2375
    volumes:
      - ./channels.json:/app/channels.json
      - ./otterlyApiRoutes.json:/app/otterlyApiRoutes.json
    networks:
      - mineotter_bridge
      - discord-bots-net

networks:
  mineotter_bridge:
    driver: bridge
  discord-bots-net:
    name: discord-bots-net
    external: true
